# SampleBoot settings, read at every boot.
# Colours are "#RRGGBB" (keep the quotes), opacities 0-100 (0 = invisible).
# sampleboot.original.conf next to this file holds the original values: copy it
# over this one to start again. tools/theme-editor.html edits this file.

# ---- Behaviour ----
TIMEOUT=10          # seconds without input before the shown system starts (0 = wait forever)
TIMEOUT_BROWSE=20   # the same, once the encoder has been turned
BEEP=100            # countdown beeps in the last 5 seconds: level 1-100 (scaled by Main Volume), 0 = off
GRACE=60            # seconds an OS gets to start before falling back to stock
IN_PLACE=1          # 1 = each OS runs from autorun/, as if it were alone on the card; 0 = from autorun/mods/<name>

# ---- Splash screen ----
SPLASH="dark"       # "dark", "light", "off", or a name of your own: shows splash-<name>.png (320x240) from this folder
SPLASH_TIME=2       # seconds on screen (turning or pushing the encoder skips it)

# ---- Top bar ----
TOP_BAR_BG="#000000"          # background
TOP_BAR_OPACITY=73            # background opacity over the image
TOP_BAR_LINE="#8A8A94"        # line at its lower edge
TOP_BAR_TITLE="#FFFFFF"       # "SampleBoot"
TOP_BAR_COUNTDOWN="#8A8A94"   # "Auto start in 10 s"

# ---- Bottom bar (also used by the "Starting ..." screen) ----
BOTTOM_BAR_BG="#000000"       # background
BOTTOM_BAR_OPACITY=73         # background opacity over the image
BOTTOM_BAR_LINE="#8A8A94"     # line at its upper edge
BOTTOM_BAR_NAME="#FFFFFF"     # name of the system
BOTTOM_BAR_INFO="#8A8A94"     # "1 / 10 · turn to browse · push to start"
BOTTOM_BAR_ARROWS="#E1E1E4"   # left and right arrows

# ---- Title screen, for a system without its own image ----
TEMPLATE_BG="#000000"         # background
TEMPLATE_TEXT="#FF0000"       # name
TEMPLATE_SUBTEXT="#AA0000"    # second line, e.g. "Original firmware 1.3.0.12"

# ---- Switch-off question ----
POPUP_SHADE="#000000"         # colour laid over the menu behind the box
POPUP_SHADE_OPACITY=78        # its opacity
POPUP_BG="#18181C"            # box background
POPUP_BORDER="#D62828"        # box border
POPUP_TITLE="#FFFFFF"         # "Switch off the MPC?"
POPUP_TEXT="#E1E1E4"          # instructions
POPUP_INFO="#8A8A94"          # "Back to the menu in 10 s"

# ---- "Switching off..." screen ----
SWITCHOFF_BG="#000000"        # background
SWITCHOFF_TEXT="#FFFFFF"      # text
